name: Check
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Pruebas de lógica pura (sin medios, audio ni render; el catálogo de marca y
      # la tinta del resaltado se verifican en local con `pink_loop.py gates`).
      - run: node scripts/test_editor_ai.mjs
      - run: node scripts/test_personalization_contract.mjs
      - run: node scripts/test_editorial_step.mjs
      - run: node scripts/test_resource_policy.mjs
      - run: node scripts/test_revise.mjs
      - run: npm run web:build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # test_pink_loop invoca utilidades node que importan de node_modules.
      - run: npm ci
      # Lista explícita: discover recogería utilidades que no son pruebas.
      - run: |
          # test_native_layout/test_one_shot_music/test_editorial_eval/test_media_evidence
          # se incorporan tras la regresion del piloto (99581cb) para que la
          # decision de musica, el layout nativo y el hashing queden cubiertos.
          # Quedan fuera test_local_image_media y test_render_snapshot_e2e:
          # requieren fixtures locales ausentes del repo (fallos de entorno
          # documentados, no verdes disfrazados).
          for test in test_source_coverage test_speech_cuts test_editorial_recipes \
            test_editorial_controls test_personalization_contract test_pink_loop \
            test_round_notes test_worker_queue test_director_controls \
            test_sound_events test_stock_queries test_stock_relevance \
            test_media_intake test_native_layout test_one_shot_music \
            test_editorial_eval test_media_evidence; do
            python "scripts/$test.py" || exit 1
          done

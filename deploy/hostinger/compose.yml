services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
    image: pink-ai-web:20261014
    container_name: pink-ai-web
    restart: unless-stopped
    init: true
    cpus: 0.25
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      VERCEL: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: tradingbot-wallets_default


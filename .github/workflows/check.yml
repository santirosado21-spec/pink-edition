name: Check
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # test_one_shot_intake invoca ffmpeg para sus fixtures; el runner no lo trae.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Pruebas de lógica pura: corren con npm ci solamente, sin servidor de
      # desarrollo, navegador, render, fuentes remotas, assets de marca locales
      # ni config de la Mac. Las 14 restantes de scripts/test_*.mjs dependen de
      # ese entorno y se verifican en local: servidor/app y fuentes
      # (test_editor_fonts, test_local_preview_browser, test_fullscreen_words,
      # test_brand_kit, test_local_execution, test_local_export,
      # test_media_evidence_export), render con Chrome y tipografías
      # (test_editorial_render, test_editorial_fullscreen_render,
      # test_editorial_scene), Playwright (test_one_shot_browser,
      # test_personalization_browser), assets de marca no versionados
      # (test_brand_catalog) y venv de herramientas (test_photo_contract).
      - run: |
          for test in test_editor_ai test_personalization_contract \
            test_editorial_step test_resource_policy test_revise test_one_shot_render_retry \
            test_billing test_candidate_versions test_caption_ink \
            test_caption_pages test_commons_photos test_contextual_proposal \
            test_editorial_preferences test_editorial_preferences_ui \
            test_editorial_review_ui test_intake_presets test_ollama_editor \
            test_one_shot_intake test_pixabay_photos test_static_style_samples \
            test_stock_photos test_style_demo test_style_selection test_themes; do
            node "scripts/$test.mjs" || exit 1
          done
      - run: npm run web:build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # test_pink_loop invoca utilidades node que importan de node_modules.
      - run: npm ci
      # Lista explícita: discover recogería utilidades que no son pruebas.
      - run: |
          # test_native_layout/test_one_shot_music/test_editorial_eval/test_media_evidence
          # se incorporan tras la regresion del piloto (99581cb) para que la
          # decision de musica, el layout nativo y el hashing queden cubiertos.
          # Quedan fuera test_local_image_media y test_render_snapshot_e2e:
          # requieren fixtures locales ausentes del repo (fallos de entorno
          # documentados, no verdes disfrazados).
          for test in test_source_coverage test_speech_cuts test_editorial_recipes \
            test_editorial_controls test_personalization_contract test_pink_loop \
            test_round_notes test_worker_queue test_director_controls \
            test_sound_events test_stock_queries test_stock_relevance \
            test_media_intake test_native_layout test_one_shot_music \
            test_editorial_eval test_media_evidence test_render_smoke_contract; do
            python "scripts/$test.py" || exit 1
          done
